name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + PostgreSQL integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p2p-transfer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Entegrasyon testleri gömülü PostgreSQL 16 ile koşar; ayrı bir veritabanı servisi gerekmez
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: p2p-transfer/target/surefire-reports

  frontend:
    name: Frontend (lint, types, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, desktop + mobile)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build SPA into the backend
        working-directory: frontend
        run: |
          npm ci
          npm run build:backend
          npx playwright install --with-deps chromium
      - name: Start app (embedded PostgreSQL + demo data)
        working-directory: p2p-transfer
        run: |
          ./mvnw -B -q test-compile
          nohup ./mvnw -B -q spring-boot:test-run -Dspring-boot.run.main-class=p2p_transfer.DevServer > app.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health/readiness && exit 0
            sleep 2
          done
          cat app.log
          exit 1
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            p2p-transfer/app.log
