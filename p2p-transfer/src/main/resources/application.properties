spring.application.name=p2p-transfer

# Veritabanı Bağlantı Ayarları (ortam değişkenleriyle ezilebilir)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/p2p_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Şema artık Flyway migration'larıyla yönetilir; Hibernate yalnızca doğrular
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Hibernate tarafından oluşturulmuş mevcut bir veritabanı varsa onu "sürüm 0" kabul edip üzerine migrate et
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Oturum çerezi güvenliği: JavaScript erişemez (XSS), başka sitelerden gönderilmez (CSRF)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=BQSESSION
server.servlet.session.timeout=15m
spring.web.error.include-message=never

spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=p2p_transfer

# --- İş kuralları ---
app.bank.code=00999
app.bank.zone=Europe/Istanbul
app.bank.max-accounts-per-user=5
app.transfer.daily-limit=50000.00
app.security.max-failed-logins=5
app.security.lock-duration=15m
app.onboarding.welcome-balance=0

# Para istekleri bu süre sonunda kendiliğinden düşer
app.payment-requests.expiry=7d

# Zamanlanmış görevler (düzenli transferler, süresi dolan istekler, SSE nabzı)
app.scheduling.enabled=true
app.scheduled-transfers.poll-interval=60s

# Hız sınırları (token bucket)
app.rate-limit.enabled=true
app.rate-limit.login.capacity=10
app.rate-limit.login.period=1m
app.rate-limit.register.capacity=5
app.rate-limit.register.period=10m
app.rate-limit.lookup.capacity=30
app.rate-limit.lookup.period=1m
app.rate-limit.transfer.capacity=20
app.rate-limit.transfer.period=1m
app.rate-limit.payment-request.capacity=10
app.rate-limit.payment-request.period=1m
